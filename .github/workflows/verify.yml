name: Static source release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify public source inventory
        run: python scripts/verify_release.py
      - name: Build deterministic source archives
        run: python scripts/build_release.py
      - name: Confirm repeat build
        run: python scripts/build_release.py
      - name: Independently extract all three packages
        run: python scripts/verify_archives.py --dist dist --work-dir '${{ runner.temp }}/compositing-unpacked'
      # These jobs intentionally do not run Blender/GPU or certify visual work.
